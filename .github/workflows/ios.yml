name: iOS Build and Test

on:
  push:
    branches: [main, "feat/ios-*"]
    paths:
      - "ios/**"
      - "docs/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "docs/ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -resolvePackageDependencies

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project ios/ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClipStudioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          test -n "$DEVICE_ID"
          xcodebuild \
            -project ios/ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/ClipStudioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Analyze iOS app
        run: |
          xcodebuild \
            -project ios/ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClipStudioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Build generic iOS device target
        run: |
          xcodebuild \
            -project ios/ClipStudio.xcodeproj \
            -scheme ClipStudio \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ClipStudioDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
